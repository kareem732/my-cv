<section id="contactUs" class="py-24 bg-slate-50 relative overflow-hidden">
    <div class="absolute top-0 right-0 w-1/3 h-full bg-[var(--main-color)]/5 -skew-x-12 transform origin-top"></div>

    <div class="container mx-auto px-6 relative z-10">
        <div class="max-w-6xl mx-auto">
            <div class="bg-white rounded-[3rem] shadow-2xl shadow-slate-200/50 overflow-hidden border border-slate-100">
                <div class="flex flex-col lg:flex-row">

                    <div class="lg:w-2/3 p-10 md:p-16">
                        <div class="mb-10">
                            <h3 class="text-4xl font-black text-[var(--main-color)] mb-4">Contact Us</h3>
                            <p class="text-slate-500 max-w-md leading-relaxed">Feel free to contact us any time. We will get back to you as soon as we can!</p>
                        </div>

                        <form class="space-y-6">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <input type="text" placeholder="Name" class="w-full px-6 py-4 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-[var(--main-color)]/20 focus:bg-white transition-all">
                                <input type="email" placeholder="Email" class="w-full px-6 py-4 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-[var(--main-color)]/20 focus:bg-white transition-all">
                            </div>
                            <textarea placeholder="Message" rows="5" class="w-full px-6 py-4 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-[var(--main-color)]/20 focus:bg-white transition-all resize-none"></textarea>

                            <div class="flex flex-col md:flex-row items-center justify-between gap-6 pt-4">
                                <button class="w-full cursor-pointer md:w-auto bg-[var(--main-color)] hover:opacity-90 text-white font-bold px-12 py-4 rounded-2xl transition-all shadow-lg active:scale-95 shadow-[var(--main-color)]/20">
                                    Send Message
                                </button>

                                <ul class="flex gap-4">
                                    <li><a href="#" class="w-10 h-10 flex items-center justify-center rounded-xl bg-slate-100 text-slate-400 hover:bg-blue-600 hover:text-white transition-all"><i class="fab fa-facebook-f"></i></a></li>
                                    <li><a href="#" class="w-10 h-10 flex items-center justify-center rounded-xl bg-slate-100 text-slate-400 hover:bg-pink-600 hover:text-white transition-all"><i class="fab fa-instagram"></i></a></li>
                                    <li><a href="#" class="w-10 h-10 flex items-center justify-center rounded-xl bg-slate-100 text-slate-400 hover:bg-sky-500 hover:text-white transition-all"><i class="fab fa-twitter"></i></a></li>
                                </ul>
                            </div>
                        </form>
                    </div>

                    <div class="lg:w-1/3 bg-[var(--main-color)] p-10 md:p-16 text-white relative">
                        <div class="absolute top-0 right-0 w-32 h-32 bg-orange-400/20 blur-3xl rounded-full"></div>

                        <h4 class="text-2xl font-bold mb-12 relative z-10">Contact Info</h4>

                        <div class="space-y-10 relative z-10">
                            <div class="flex items-start gap-5 group">
                                <div class="w-12 h-12 rounded-xl bg-white/10 flex items-center justify-center text-orange-400 group-hover:bg-white group-hover:text-[var(--main-color)] transition-all">
                                    <i class="fas fa-headset text-xl"></i>
                                </div>
                                <div>
                                    <p class="text-xs uppercase tracking-widest text-white/60 mb-1">Support Line</p>
                                    <span class="font-bold">+91 8009 054294</span>
                                </div>
                            </div>

                            <div class="flex items-start gap-5 group">
                                <div class="w-12 h-12 rounded-xl bg-white/10 flex items-center justify-center text-orange-400 group-hover:bg-white group-hover:text-[var(--main-color)] transition-all">
                                    <i class="fas fa-envelope-open-text text-xl"></i>
                                </div>
                                <div>
                                    <p class="text-xs uppercase tracking-widest text-white/60 mb-1">Email Us</p>
                                    <span class="font-bold text-sm">info&#64;guidy.com</span>
                                </div>
                            </div>

                            <div class="flex items-start gap-5 group">
                                <div class="w-12 h-12 rounded-xl bg-white/10 flex items-center justify-center text-orange-400 group-hover:bg-white group-hover:text-[var(--main-color)] transition-all">
                                    <i class="fas fa-map-marked-alt text-xl"></i>
                                </div>
                                <div>
                                    <p class="text-xs uppercase tracking-widest text-white/60 mb-1">Location</p>
                                    <span class="text-sm text-white/80 leading-relaxed">1000+ Partners and 65+ Service city across India, USA & UAE</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
