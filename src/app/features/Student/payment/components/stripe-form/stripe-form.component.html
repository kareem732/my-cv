<div ngSkipHydration>

  @if (isLoading()) {
    <div class="space-y-3 animate-pulse">
      <div class="h-14 bg-gray-100 dark:bg-gray-700 rounded-xl"></div>
      <div class="h-14 bg-gray-100 dark:bg-gray-700 rounded-xl"></div>
      <div class="h-14 bg-gray-100 dark:bg-gray-700 rounded-xl"></div>
    </div>
  }

  <div
    #paymentElement
    [class.hidden]="isLoading()">
  </div>

  @if (errorMessage()) {
    <div class="mt-3 p-3 bg-red-50 dark:bg-red-900/20 border border-red-100 dark:border-red-800 rounded-lg flex items-start gap-2">
      <svg class="w-4 h-4 text-red-500 shrink-0 mt-0.5"
           fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      <p class="text-xs text-red-600 dark:text-red-400">{{ errorMessage() }}</p>
    </div>
  }

  <button
    (click)="submitPayment()"
    [disabled]="!stripeReady() || isSubmitting()"
    class="mt-5 w-full py-3.5 bg-blue-500 hover:bg-blue-600 cursor-pointer
           disabled:bg-gray-200 dark:disabled:bg-gray-700 disabled:cursor-not-allowed
           text-white dark:disabled:text-gray-500 font-semibold text-sm rounded-xl
           transition-colors flex items-center justify-center gap-2">

    @if (isSubmitting()) {
      <div class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
      Processing...
    } @else {
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/>
      </svg>
      Pay Now
    }

  </button>

</div>
