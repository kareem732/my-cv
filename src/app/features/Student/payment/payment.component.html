@if (error()) {
  <div class="min-h-screen bg-white dark:bg-gray-900 flex items-center justify-center p-4">
    <div class="text-center space-y-4 max-w-sm">
      <div class="w-12 h-12 bg-red-50 dark:bg-red-900/20 rounded-full flex items-center justify-center mx-auto">
        <svg class="w-6 h-6 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      </div>
      <p class="text-gray-500 dark:text-gray-400 text-sm">{{ error() }}</p>
      <button onclick="history.back()"
              class="px-5 py-2 bg-blue-500 cursor-pointer text-white text-sm rounded-lg hover:bg-blue-600 transition-colors">
        Go Back
      </button>
    </div>
  </div>
}

@if (!error() && clientSecret()) {
  <div class="min-h-screen bg-gray-50 dark:bg-gray-900">

    <!-- Top Bar -->
    <div class="bg-white dark:bg-gray-800 border-b border-gray-100 dark:border-gray-700 px-4 py-3">
      <div class="max-w-lg mx-auto flex items-center gap-2 text-sm text-gray-400 dark:text-gray-500">
        <button onclick="history.back()" class="hover:text-gray-600 dark:hover:text-gray-300 cursor-pointer  transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
          </svg>
        </button>
        <span>Payment</span>
      </div>
    </div>

    <!-- Body -->
    <div class="max-w-lg mx-auto px-4 py-10">
      <div class="bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 rounded-2xl p-6 shadow-sm">

        <div class="flex items-center gap-2 mb-6">
          <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2
                     2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
          <h1 class="text-base font-semibold text-gray-800 dark:text-gray-100">Secure Payment</h1>
        </div>

        <app-stripe-form
          [clientSecret]="clientSecret()!"
          (paymentSuccess)="onPaymentSuccess()"
          (paymentError)="onPaymentError($event)" />

        <p class="text-center text-xs text-gray-400 dark:text-gray-500 mt-4">
          🔒 Your payment is secured by Stripe
        </p>
      </div>
    </div>

  </div>
}
