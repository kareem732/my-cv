@if (isLoading()) {
  <div class="min-h-screen bg-gray-50 dark:bg-gray-900 p-8">
    <div class="w-full max-w-5xl mx-auto animate-pulse">
      <div class="grid grid-cols-1 lg:grid-cols-5 gap-6">

        <div class="lg:col-span-3">
          <div class="bg-white dark:bg-gray-800 rounded-2xl border border-gray-100 dark:border-gray-700 p-5 space-y-3">
            <div class="flex items-center gap-2">
              <div class="w-7 h-7 bg-gray-100 dark:bg-gray-700 rounded-lg"></div>
              <div class="h-3 w-28 bg-gray-200 dark:bg-gray-700 rounded-full"></div>
            </div>
            <div class="h-11 bg-gray-100 dark:bg-gray-700 rounded-xl"></div>
            <div class="h-11 w-24 bg-gray-200 dark:bg-gray-700 rounded-xl"></div>
          </div>
        </div>

        <div class="lg:col-span-2">
          <div class="bg-white dark:bg-gray-800 rounded-2xl border border-gray-100 dark:border-gray-700 p-5 space-y-4">
            <div class="h-4 w-28 bg-gray-200 dark:bg-gray-700 rounded-full"></div>
            <div class="h-px bg-gray-100 dark:bg-gray-700"></div>
            <div class="space-y-3">
              <div class="flex justify-between">
                <div class="h-3 w-16 bg-gray-100 dark:bg-gray-700 rounded-full"></div>
                <div class="h-3 w-12 bg-gray-100 dark:bg-gray-700 rounded-full"></div>
              </div>
              <div class="flex justify-between">
                <div class="h-3 w-20 bg-gray-100 dark:bg-gray-700 rounded-full"></div>
                <div class="h-3 w-10 bg-gray-100 dark:bg-gray-700 rounded-full"></div>
              </div>
              <div class="flex justify-between pt-2 border-t border-gray-100 dark:border-gray-700">
                <div class="h-4 w-12 bg-gray-200 dark:bg-gray-700 rounded-full"></div>
                <div class="h-4 w-16 bg-gray-200 dark:bg-gray-700 rounded-full"></div>
              </div>
            </div>
            <div class="h-11 bg-gray-200 dark:bg-gray-700 rounded-xl"></div>
          </div>
        </div>

      </div>
    </div>
  </div>
}

@if (error()) {
  <div class="min-h-screen bg-gray-50 dark:bg-gray-900 flex items-center justify-center p-4">
    <div class="bg-white dark:bg-gray-800 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm p-8 max-w-sm w-full text-center space-y-4">
      <div class="w-14 h-14 bg-red-50 dark:bg-red-900/20 rounded-full flex items-center justify-center mx-auto">
        <svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      </div>
      <div>
        <h2 class="text-lg font-bold text-gray-900 dark:text-white">Something went wrong</h2>
        <p class="text-sm text-gray-400 dark:text-gray-500 mt-1">{{ error() }}</p>
      </div>
      <button
        routerLink="/"
        class="w-full py-3 bg-blue-500 hover:bg-blue-600 text-white text-sm font-semibold rounded-xl transition-colors">
        Go Home
      </button>
    </div>
  </div>
}

@if (!isLoading() && !error() && order(); as o) {

  <div class="min-h-screen bg-gray-50 dark:bg-gray-900">

    <div class="bg-white dark:bg-gray-800 border-b border-gray-100 dark:border-gray-700 sticky top-0 z-10">
      <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
        <div>
          <h1 class="text-sm font-semibold text-gray-900 dark:text-white">Secure Checkout</h1>
          <p class="text-xs text-gray-400 dark:text-gray-500">SSL secured payment</p>
        </div>
        <div class="hidden sm:flex items-center gap-2 text-xs text-gray-400 dark:text-gray-500">
          <svg class="w-3.5 h-3.5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
          </svg>
          Trusted Checkout
        </div>
      </div>
    </div>

    <div class="max-w-5xl mx-auto px-4 py-8">
      <div class="grid grid-cols-1 lg:grid-cols-5 gap-6 items-start">

        <div class="lg:col-span-3 space-y-4">
          <app-coupon-form
            [orderId]="o.orderId"
            (orderUpdated)="onCouponApplied($event)"
            (couponRemoved)="removeCoupon()">
          </app-coupon-form>
        </div>

        <div class="lg:col-span-2">
          <div class="bg-white dark:bg-gray-800 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm overflow-hidden sticky top-24">

            <div class="p-5 border-b border-gray-100 dark:border-gray-700">
              <h2 class="text-sm font-semibold text-gray-800 dark:text-gray-100">Order Summary</h2>
            </div>

            <div class="p-5">
              <app-price-breakdown [order]="o"></app-price-breakdown>
            </div>

            <div class="px-5 pb-5">
              <button
                (click)="proceedToPayment()"
                class="w-full py-3.5 bg-blue-500 hover:bg-blue-600
                       text-white text-sm font-bold rounded-xl
                       transition-colors flex items-center justify-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/>
                </svg>
                {{ o.isFree ? 'Enroll Free' : 'Proceed to Payment' }}
              </button>
              <p class="text-center text-xs text-gray-400 dark:text-gray-500 mt-3">
                Secure payment powered by Stripe
              </p>
            </div>

          </div>
        </div>

      </div>
    </div>

  </div>
}
