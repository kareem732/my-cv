<div class="bg-white dark:bg-gray-800 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm p-5">

  <div class="flex items-center gap-2 mb-4">
    <div class="w-7 h-7 bg-blue-50 dark:bg-blue-900/30 rounded-lg flex items-center justify-center">
      <svg class="w-3.5 h-3.5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/>
      </svg>
    </div>
    <h2 class="text-sm font-semibold text-gray-800 dark:text-gray-100">Have a coupon?</h2>
  </div>

  @if (couponApplied()) {
    <div class="flex items-center justify-between p-3 bg-green-50 dark:bg-green-900/20 border border-green-200 dark:border-green-800 rounded-xl">
      <div class="flex items-center gap-2">
        <svg class="w-4 h-4 text-green-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
        </svg>
        <span class="text-sm font-semibold text-green-700 dark:text-green-400">
          {{ successMsg() }}
        </span>
      </div>
      <button
        (click)="removeCoupon()"
        class="cursor-pointer text-xs text-green-600 dark:text-green-400 hover:text-green-800 dark:hover:text-green-300 font-medium underline underline-offset-2 transition-colors">
        Remove
      </button>
    </div>
  }

  @if (!couponApplied()) {
    <div class="space-y-3">
      <div class="flex gap-2">
        <input
          type="text"
          [value]="couponCode()"
          (input)="couponCode.set($any($event.target).value); errorMsg.set(null)"
          placeholder="Enter coupon code"
          (keyup.enter)="applyCoupon()"
          class="flex-1 px-4 py-3 text-sm border rounded-xl outline-none transition-all
                 placeholder:text-gray-300 dark:placeholder:text-gray-600
                 text-gray-800 dark:text-gray-100 font-mono tracking-wider uppercase
                 bg-white dark:bg-gray-700
                 border-gray-200 dark:border-gray-600
                 focus:border-blue-400 focus:ring-2 focus:ring-blue-100 dark:focus:ring-blue-900/40"
          [class.border-red-300]="errorMsg()"
          [class.dark:border-red-700]="errorMsg()"
        />
        <button
          (click)="applyCoupon()"
          [disabled]="isDisabled()"
          class="px-5 py-3 bg-blue-500 cursor-pointer hover:bg-blue-600 disabled:opacity-40 disabled:cursor-not-allowed
                 text-white text-sm font-semibold rounded-xl transition-colors flex items-center gap-2 shrink-0">
          @if (isApplying()) {
            <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
            </svg>
          }
          @if (!isApplying()) { Apply }
        </button>
      </div>

      @if (errorMsg()) {
        <div class="flex items-center gap-2 text-xs text-red-500 dark:text-red-400">
          <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <span>{{ errorMsg() }}</span>
        </div>
      }
    </div>
  }

</div>
