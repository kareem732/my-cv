<div class="w-full bg-white border-b border-gray-200 shadow-sm relative">
  @if (loading) {
    <div class="flex gap-4 px-6 py-3 overflow-x-auto">
      @for (s of [1,2,3,4,5,6]; track s) {
        <div class="h-8 w-28 rounded-full bg-gray-200 animate-pulse flex-shrink-0"></div>
      }
    </div>
  }

  @if (!loading) {
    <div class="flex items-center gap-1 px-4 overflow-x-auto scrollbar-hide">
      @for (cat of categories; track cat.id) {
        <div class="flex-shrink-0">
          <button
            (click)="setActive(cat, $event)"
            [class]="'flex items-center gap-2 px-4 py-3 text-sm font-medium transition-colors duration-200 border-b-2 whitespace-nowrap '
              + (isActive(cat)
                  ? 'border-blue-600 text-blue-600'
                  : 'border-transparent text-gray-600 hover:text-blue-600 hover:border-blue-300')">
            <img [src]="cat.iconUrl" [alt]="cat.name" class="w-4 h-4 object-contain" />
            {{ cat.name }}
            <svg
              class="w-3 h-3 ml-1 transition-transform duration-200"
              [class.rotate-180]="isActive(cat)"
              fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </button>
        </div>
      }
    </div>
    @if (activeCategory) {
      <div
        class="fixed inset-0 z-40"
        (click)="closeDropdown()">
      </div>

      <div
        class="absolute top-full w-56 bg-white rounded-b-xl shadow-xl z-50 border border-gray-100 overflow-hidden"
        [style.left.px]="activeOffsetLeft">
        <div class="p-2">

          <button
            (click)="navigateToCategory(activeCategory.id)"
            class="w-full text-left px-3 py-2 text-sm font-semibold text-blue-600 hover:bg-blue-50 rounded-lg transition-colors">
            All in {{ activeCategory.name }}
            <span class="ml-1 text-xs text-gray-400">({{ activeCategory.totalCourses }})</span>
          </button>

          <hr class="my-1 border-gray-100" />

          @for (sub of activeCategory.subCategories; track sub.id) {
            <button
              (click)="navigateToSub(activeCategory.id, sub.id)"
              class="w-full text-left px-3 py-2 text-sm text-gray-700 hover:bg-gray-50 rounded-lg transition-colors flex justify-between items-center">
              <span>{{ sub.name }}</span>
              <span class="text-xs text-gray-400">{{ sub.courseCount }}</span>
            </button>
          }

        </div>
      </div>
    }
  }

</div>
