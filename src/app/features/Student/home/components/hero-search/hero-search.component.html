<section class="relative bg-gradient-to-br from-blue-700 to-blue-500 py-20 px-4">
  <div class="max-w-3xl mx-auto text-center">

    <h1 class="text-4xl font-extrabold text-white mb-3 tracking-tight">
      Learn Without Limits
    </h1>
    <p class="text-blue-100 text-lg mb-8">
      Explore thousands of courses taught by expert instructors.
    </p>

    <div class="relative">
      <div class="flex items-center bg-white rounded-xl shadow-lg overflow-hidden">
        <span class="pl-4 text-gray-400">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"/>
          </svg>
        </span>
        <input
          type="text"
          [(ngModel)]="query"
          (input)="onInput()"
          (keyup.enter)="search()"
          (blur)="onBlur()"
          placeholder="What do you want to learn?"
          class="flex-1 py-4 px-3 text-gray-800 text-sm outline-none bg-transparent" />

        @if (loading) {
          <span class="pr-3">
            <svg class="animate-spin w-5 h-5 text-blue-500" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
              <path class="opacity-75" fill="currentColor"
                d="M4 12a8 8 0 018-8v8H4z"/>
            </svg>
          </span>
        }

        <button
          (click)="search()"
          class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-6 py-4 transition-colors duration-200">
          Search
        </button>
      </div>

      @if (showDropdown) {
        <ul class="absolute left-0 right-0 top-full mt-1 bg-white rounded-xl shadow-xl z-50 overflow-hidden divide-y divide-gray-100">
          @for (s of suggestions; track s.courseId) {
            <li
              (mousedown)="selectSuggestion(s)"
              class="flex items-center gap-3 px-4 py-3 hover:bg-blue-50 cursor-pointer transition-colors">
              <img [src]="s.thumbnailUrl" [alt]="s.title"
                class="w-10 h-10 rounded-md object-cover flex-shrink-0" />
              <div class="flex flex-col text-left">
                <span class="text-sm font-medium text-gray-800">{{ s.title }}</span>
                <span class="text-xs text-gray-400">{{ s.category }}</span>
              </div>
            </li>
          }
        </ul>
      }
    </div>

  </div>
</section>
