@if (isOpen()) {
  <div (click)="closeSidebar.emit()" class="fixed inset-0 z-40 bg-black/40 lg:hidden"></div>
}

<aside
  [class.translate-x-0]="isOpen()"
  class="fixed top-0 left-0 z-50 w-72 h-screen bg-white dark:bg-gray-900 border-r border-gray-200 dark:border-gray-700 transition-transform duration-300 ease-in-out -translate-x-full lg:translate-x-0 px-4">

  <!-- Logo -->
  <div class="flex items-center h-[64px] border-b border-gray-100 dark:border-gray-700">
    <a href="#" class="flex items-center gap-2 cursor-pointer">
      <svg width="36" height="36" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
        <polygon points="70,8 118,35 118,90 70,117 22,90 22,35" fill="#4A3ADF"/>
        <polygon points="70,18 108,41 108,84 70,107 32,84 32,41" fill="none" stroke="white" stroke-width="1.5" opacity="0.2"/>
        <rect x="48" y="38" width="9" height="64" rx="4" fill="white"/>
        <line x1="57" y1="70" x2="88" y2="39" stroke="white" stroke-width="9" stroke-linecap="round"/>
        <line x1="57" y1="70" x2="88" y2="101" stroke="white" stroke-width="9" stroke-linecap="round"/>
        <circle cx="112" cy="35" r="12" fill="#F97316"/>
        <circle cx="112" cy="35" r="6" fill="white" opacity=".4"/>
      </svg>
      <span style="font-family:system-ui,sans-serif; font-size:20px; font-weight:800; color:#4A3ADF; letter-spacing:-0.5px;">
        Kno<span style="color:#F97316;">via</span>
      </span>
    </a>
  </div>

  <!-- Profile Section -->
  <div class="flex items-center gap-3 my-6 px-2">
    <img
      class="rounded-full w-14 h-14 object-cover ring-2 ring-gray-100 dark:ring-gray-700"
      [src]="getAvatarUrl(user()?.profilePictureUrl)"
      alt="Profile"
    />
    <div>
      <p class="text-sm font-bold text-gray-900 dark:text-white truncate max-w-[160px]">{{ user()?.fullName || '...' }}</p>
      <span class="text-xs text-gray-400 dark:text-gray-500">
        Joined {{ user()?.createdAt | date:'MMM yyyy' }}
      </span>
    </div>
  </div>

  <ul class="space-y-1 font-medium">
    <li class="px-3 py-2 text-[10px] font-bold text-gray-400 dark:text-gray-500 uppercase tracking-widest">Menu</li>
    <li>
      <a routerLink="/student/profile/my-profile" routerLinkActive="bg-neutral-100 dark:bg-gray-800 text-fg-brand"
         (click)="closeSidebar.emit()"
         class="flex items-center p-2.5 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-800 group transition-all">
        <svg class="w-5 h-5 text-gray-500 dark:text-gray-400 group-hover:text-fg-brand" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path d="M16 19h4a1 1 0 0 0 1-1v-1a3 3 0 0 0-3-3h-2m-2.236-4a3 3 0 1 0 0-4M3 18v-1a3 3 0 0 1 3-3h4a3 3 0 0 1 3 3v1a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Zm8-10a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
        </svg>
        <span class="ms-3 text-sm">My Profile</span>
      </a>
    </li>
    <li>
      <a routerLink="/student/profile/my-learnings" routerLinkActive="bg-neutral-100 dark:bg-gray-800 text-fg-brand"
         (click)="closeSidebar.emit()"
         class="flex items-center p-2.5 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-800 group transition-all">
        <i class="fa-solid fa-book-open w-5 h-5 flex items-center justify-center text-gray-500 dark:text-gray-400 group-hover:text-fg-brand transition-colors text-sm"></i>
        <span class="ms-3 text-sm">My Learnings</span>
      </a>
    </li>
    <li>
      <a routerLink="/student/profile/my-certificates" routerLinkActive="bg-neutral-100 dark:bg-gray-800 text-fg-brand"
         (click)="closeSidebar.emit()"
         class="flex items-center p-2.5 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-800 group transition-all">
        <i class="fa-solid fa-certificate w-5 h-5 flex items-center justify-center text-gray-500 dark:text-gray-400 group-hover:text-fg-brand transition-colors text-sm"></i>
        <span class="ms-3 text-sm">My Certificates</span>
      </a>
    </li>
    <br>
    <li>
      <button
        (click)="logoutClicked.emit()"
        class="w-full cursor-pointer flex items-center p-2.5 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-red-50 dark:hover:bg-red-900/20 hover:text-red-600 group transition-all duration-200">
        <svg class="w-5 h-5 text-gray-500 dark:text-gray-400 group-hover:text-red-600 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16 12H4m12 0-4 4m4-4-4-4m3-4h2a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3h-2"/>
        </svg>
        <span class="ms-3 text-sm font-medium text-start">Sign Out</span>
      </button>
    </li>
  </ul>
</aside>
