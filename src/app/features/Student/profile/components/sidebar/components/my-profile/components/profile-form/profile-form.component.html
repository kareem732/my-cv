<form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="flex flex-col gap-1.5">
      <label class="text-sm font-semibold text-heading">First Name</label>
      <input
        formControlName="firstName"
        type="text"
        placeholder="First name"
        class="px-4 py-3 rounded-xl border border-default bg-white dark:bg-gray-700 dark:text-white dark:placeholder-gray-400 text-body text-sm focus:outline-none focus:ring-2 focus:ring-[var(--main-color)] transition-all"
      />
    </div>
    <div class="flex flex-col gap-1.5">
      <label class="text-sm font-semibold text-heading">Last Name</label>
      <input
        formControlName="lastName"
        type="text"
        placeholder="Last name"
        class="px-4 py-3 rounded-xl border border-default bg-white dark:bg-gray-700 dark:text-white dark:placeholder-gray-400 text-body text-sm focus:outline-none focus:ring-2 focus:ring-[var(--main-color)] transition-all"
      />
    </div>
  </div>

  <div class="flex flex-col gap-1.5">
    <label class="text-sm font-semibold text-heading">Bio</label>
    <textarea
      formControlName="bio"
      rows="5"
      placeholder="Tell us about yourself..."
      class="px-4 py-3 rounded-xl border border-default bg-white dark:bg-gray-700 dark:text-white dark:placeholder-gray-400 text-body text-sm focus:outline-none focus:ring-2 focus:ring-[var(--main-color)] transition-all resize-none"
    ></textarea>
  </div>

</form>
