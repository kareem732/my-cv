<form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="flex flex-col gap-1.5">
      <label class="text-sm font-semibold text-heading">First Name</label>
      <input
        formControlName="firstName"
        type="text"
        placeholder="First name"
        class="px-4 py-3 rounded-xl border border-default bg-white dark:bg-gray-700 dark:text-white dark:placeholder-gray-400 text-body text-sm focus:outline-none focus:ring-2 focus:ring-[var(--main-color)] transition-all"
      />
    </div>
    <div class="flex flex-col gap-1.5">
      <label class="text-sm font-semibold text-heading">Last Name</label>
      <input
        formControlName="lastName"
        type="text"
        placeholder="Last name"
        class="px-4 py-3 rounded-xl border border-default bg-white dark:bg-gray-700 dark:text-white dark:placeholder-gray-400 text-body text-sm focus:outline-none focus:ring-2 focus:ring-[var(--main-color)] transition-all"
      />
    </div>
  </div>

  <div class="flex flex-col gap-1.5">
    <label class="text-sm font-semibold text-heading">Bio</label>
    <textarea
      formControlName="bio"
      rows="5"
      placeholder="Tell us about yourself..."
      class="px-4 py-3 rounded-xl border border-default bg-white dark:bg-gray-700 dark:text-white dark:placeholder-gray-400 text-body text-sm focus:outline-none focus:ring-2 focus:ring-[var(--main-color)] transition-all resize-none"
    ></textarea>
  </div>

  <div class="flex justify-end pt-2">
    <button
      type="submit"
      [disabled]="form.invalid || isSaving || form.pristine"
      class="flex cursor-pointer items-center gap-2 px-6 py-2.5
             bg-blue-600 hover:bg-blue-700 text-white
             text-sm font-bold rounded-xl transition-all active:scale-95
             disabled:opacity-40 disabled:cursor-not-allowed
             shadow-sm shadow-blue-200 dark:shadow-none"
    >
      @if (isSaving) {
        <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
        </svg>
        Saving...
      } @else {
        Save
      }
    </button>
  </div>

</form>
