<div class="flex flex-col items-center gap-3 mb-8">

  <div class="relative group cursor-pointer w-36 h-36" (click)="fileInput.click()">
    <img
      [src]="getAvatarUrl(user()?.profilePictureUrl)"
      class="w-36 h-36 rounded-full object-cover ring-4 ring-white shadow-md"
      alt="Avatar"
    />
    <div class="absolute inset-0 flex flex-col items-center justify-center bg-black/50 rounded-full opacity-0 group-hover:opacity-100 transition-opacity">
      <svg class="w-7 h-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
      </svg>
      <span class="text-white text-xs mt-1 font-medium">Change</span>
    </div>
    @if (isUploading) {
      <div class="absolute inset-0 flex items-center justify-center bg-black/60 rounded-full">
        <svg class="w-6 h-6 text-white animate-spin" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
        </svg>
      </div>
    }
  </div>

  <div class="text-center">
    <p class="text-base font-bold text-heading">{{ user()?.fullName || '...' }}</p>
    <p class="text-sm text-body opacity-60">{{ user()?.email }}</p>
  </div>

  @if (user()?.profilePictureUrl) {
    <button
      (click)="deleteAvatar()"
      [disabled]="isDeleting"
      class="px-4 cursor-pointer py-1.5 text-sm font-semibold rounded-xl text-red-500 border border-red-200 hover:bg-red-50 transition-all disabled:opacity-50"
    >
      {{ isDeleting ? 'Deleting...' : 'Remove Photo' }}
    </button>
  }

  <input #fileInput type="file" accept="image/*" class="hidden" (change)="onFileSelected($event)" />
</div>
