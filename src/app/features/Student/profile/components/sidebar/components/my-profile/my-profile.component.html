@if (isLoading) {
  <div class="max-w-2xl mx-auto py-8 px-4 space-y-8 animate-pulse">

    <!-- Avatar Skeleton -->
    <div class="flex flex-col items-center gap-3">
      <div class="w-36 h-36 rounded-full bg-gray-200 dark:bg-gray-700"></div>
      <div class="h-4 w-32 bg-gray-200 dark:bg-gray-700 rounded-full"></div>
      <div class="h-3 w-48 bg-gray-100 dark:bg-gray-700 rounded-full"></div>
      <div class="h-8 w-28 bg-gray-100 dark:bg-gray-700 rounded-xl"></div>
    </div>

    <!-- Form Skeleton -->
    <div class="space-y-5">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="space-y-1.5">
          <div class="h-3 w-20 bg-gray-200 dark:bg-gray-700 rounded-full"></div>
          <div class="h-11 bg-gray-100 dark:bg-gray-700 rounded-xl"></div>
        </div>
        <div class="space-y-1.5">
          <div class="h-3 w-20 bg-gray-200 dark:bg-gray-700 rounded-full"></div>
          <div class="h-11 bg-gray-100 dark:bg-gray-700 rounded-xl"></div>
        </div>
      </div>
      <div class="space-y-1.5">
        <div class="h-3 w-10 bg-gray-200 dark:bg-gray-700 rounded-full"></div>
        <div class="h-32 bg-gray-100 dark:bg-gray-700 rounded-xl"></div>
      </div>
      <div class="flex justify-end">
        <div class="h-10 w-20 bg-gray-200 dark:bg-gray-700 rounded-xl"></div>
      </div>
    </div>

  </div>
} @else {
  <div class="max-w-2xl mx-auto py-8 px-4 space-y-8">
    <app-profile-avatar
      (avatarUpdated)="onAvatarUpdated($event)"
    />
    <app-profile-form
      (profileUpdated)="onProfileUpdated($event)"
    />
  </div>
}
