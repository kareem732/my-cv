<app-navbar-instructor></app-navbar-instructor>

<app-sidebar-instructor (logoutClicked)="openLogoutPopup()"></app-sidebar-instructor>

<main class="sm:ml-64 mt-14 min-h-[calc(100vh-3.5rem)] flex flex-col">
  <router-outlet></router-outlet>
</main>

@if (isLogoutPopupOpen()) {
  <div class="fixed inset-0 z-[9999] flex items-center justify-center bg-black/50 px-4">
    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-xl w-full max-w-sm p-6">

      <div class="flex items-center gap-3 mb-4">
        <div class="w-10 h-10 rounded-full bg-red-100 flex items-center justify-center flex-shrink-0">
          <svg class="w-5 h-5 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
        </div>
        <div>
          <h3 class="text-base font-semibold text-gray-900 dark:text-white">Sign Out</h3>
          <p class="text-sm text-gray-500 dark:text-gray-400">Are you sure you want to log out?</p>
        </div>
      </div>

      <div class="flex gap-3 mt-5">
        <button (click)="closeLogoutPopup()"
          class="flex-1 px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 bg-gray-100 dark:bg-gray-700 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors cursor-pointer">
          Cancel
        </button>

        <button (click)="confirmLogout()" [disabled]="isLogoutLoading()"
          class="flex-1 px-4 py-2 text-sm font-medium text-white bg-red-600 rounded-lg hover:bg-red-700 transition-colors flex items-center justify-center gap-2 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
          @if (isLogoutLoading()) {
            <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/>
            </svg>
          }
          Sign Out
        </button>
      </div>

    </div>
  </div>
}
