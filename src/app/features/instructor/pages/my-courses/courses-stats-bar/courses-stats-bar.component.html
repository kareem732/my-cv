<div class="flex flex-wrap gap-2 mb-5">

  <div class="flex items-center gap-2 bg-gray-50 border border-gray-200 dark:bg-gray-700 dark:border-gray-600 rounded-lg px-4 py-2">
    <span class="text-base font-bold text-gray-800 dark:text-white">{{ stats.all }}</span>
    <span class="text-sm text-gray-500 dark:text-gray-400">All</span>
  </div>

  <div class="flex items-center gap-2 bg-green-50 border border-green-100 dark:bg-green-900/20 dark:border-green-800 rounded-lg px-4 py-2">
    <span class="w-2 h-2 rounded-full bg-green-500 flex-shrink-0"></span>
    <span class="text-base font-bold text-green-700 dark:text-green-400">{{ stats.published }}</span>
    <span class="text-sm text-green-600 dark:text-green-500">Published</span>
  </div>

  <div class="flex items-center gap-2 bg-gray-50 border border-gray-200 dark:bg-gray-700 dark:border-gray-600 rounded-lg px-4 py-2">
    <span class="w-2 h-2 rounded-full bg-gray-400 flex-shrink-0"></span>
    <span class="text-base font-bold text-gray-700 dark:text-gray-300">{{ stats.draft }}</span>
    <span class="text-sm text-gray-500 dark:text-gray-400">Draft</span>
  </div>

  <div class="flex items-center gap-2 bg-yellow-50 border border-yellow-100 dark:bg-yellow-900/20 dark:border-yellow-800 rounded-lg px-4 py-2">
    <span class="w-2 h-2 rounded-full bg-yellow-400 flex-shrink-0"></span>
    <span class="text-base font-bold text-yellow-700 dark:text-yellow-400">{{ stats.pending }}</span>
    <span class="text-sm text-yellow-600 dark:text-yellow-500">Pending</span>
  </div>

  <div class="flex items-center gap-2 bg-red-50 border border-red-100 dark:bg-red-900/20 dark:border-red-800 rounded-lg px-4 py-2">
    <span class="w-2 h-2 rounded-full bg-red-400 flex-shrink-0"></span>
    <span class="text-base font-bold text-red-700 dark:text-red-400">{{ stats.archived }}</span>
    <span class="text-sm text-red-500 dark:text-red-400">Archived</span>
  </div>

</div>
