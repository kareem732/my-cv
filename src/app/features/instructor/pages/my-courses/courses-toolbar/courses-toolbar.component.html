<div class="flex flex-col sm:flex-row gap-3 mb-5">

  <div class="relative flex-1">
    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
      <svg class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"/>
      </svg>
    </div>
    <input
      type="text"
      [(ngModel)]="searchTerm"
      (input)="onSearch()"
      placeholder="Search courses..."
      class="block w-full pl-10 pr-4 py-2.5 text-sm text-gray-900 border border-gray-300 rounded-lg bg-gray-50
             focus:ring-blue-500 focus:border-blue-500
             dark:bg-gray-700 dark:border-gray-600 dark:text-white dark:placeholder-gray-400"/>
  </div>

  <div class="flex items-center gap-1.5 flex-wrap">
    @for (status of statuses; track status) {
      <button
        (click)="onStatusChange(status)"
        class="text-sm px-3 py-2 rounded-lg font-medium transition-colors duration-150 cursor-pointer border"
        [ngClass]="selectedStatus === status
          ? 'bg-blue-600 text-white border-blue-600'
          : 'bg-gray-50 text-gray-600 border-gray-300 hover:bg-gray-100 dark:bg-gray-700 dark:text-gray-300 dark:border-gray-600 dark:hover:bg-gray-600'">
        {{ status }}
      </button>
    }
  </div>

  <button
    (click)="onAddCourse()"
    class="flex items-center justify-center gap-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 px-4 py-2.5 rounded-lg transition-colors cursor-pointer whitespace-nowrap">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
    </svg>
    Add Course
  </button>

</div>
