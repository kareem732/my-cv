<div [class]="mode === 'add'
  ? 'px-4 py-3 bg-green-50/50 dark:bg-green-900/10 border-l-2 border-green-400'
  : 'px-4 py-3 bg-blue-50/50 dark:bg-blue-900/10 border-l-2 border-blue-400'">

  @if (mode === 'add') {
    <p class="text-xs font-semibold text-green-700 dark:text-green-400 mb-3">New Lesson</p>
  }

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
    <div>
      <label class="block text-xs font-medium text-gray-600 dark:text-gray-400 mb-1">Title *</label>
      <input [(ngModel)]="form.title"
        class="w-full text-sm bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg px-3 py-2 outline-none text-gray-900 dark:text-white"
        [class.focus:border-green-400]="mode === 'add'"
        [class.focus:border-blue-400]="mode === 'edit'"
        placeholder="Lesson title"/>
    </div>
    <div>
      <label class="block text-xs font-medium text-gray-600 dark:text-gray-400 mb-1">Video URL</label>
      <input [(ngModel)]="form.videoUrl"
        class="w-full text-sm bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg px-3 py-2 outline-none text-gray-900 dark:text-white"
        placeholder="https://..."/>
    </div>
    <div>
      <label class="block text-xs font-medium text-gray-600 dark:text-gray-400 mb-1">Description</label>
      <input [(ngModel)]="form.description"
        class="w-full text-sm bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg px-3 py-2 outline-none text-gray-900 dark:text-white"
        placeholder="Brief description..."/>
    </div>
    <div class="flex gap-3">
      <div class="flex-1">
        <label class="block text-xs font-medium text-gray-600 dark:text-gray-400 mb-1">Duration (sec)</label>
        <input [(ngModel)]="form.durationInSeconds" type="number"
          class="w-full text-sm bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg px-3 py-2 outline-none text-gray-900 dark:text-white"
          placeholder="0"/>
      </div>
      <div class="flex-1">
        <label class="block text-xs font-medium text-gray-600 dark:text-gray-400 mb-1">Type</label>
        <select [(ngModel)]="form.type" (change)="form.type = +form.type"
          class="w-full text-sm bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg px-3 py-2 outline-none text-gray-900 dark:text-white">
          <option [value]="1">Video</option>
          <option [value]="2">Article</option>
          <option [value]="3">Quiz</option>
        </select>
      </div>
    </div>
  </div>

  <!-- ✅ Resources button — edit mode only (lesson must already exist) -->
  @if (mode === 'edit' && lessonId) {
    <div class="mt-3">
      <button
        type="button"
        (click)="showResources = !showResources"
        class="flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-lg border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-500 dark:text-gray-400 hover:border-blue-400 hover:text-blue-500 dark:hover:text-blue-400 transition-colors cursor-pointer">
        <!-- paperclip icon -->
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/>
        </svg>
        {{ showResources ? 'Hide Resources' : 'Manage Resources' }}
        <!-- chevron -->
        <svg class="w-3 h-3 transition-transform" [class.rotate-180]="showResources"
          fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
        </svg>
      </button>

   @if (showResources) {
  <app-resource-manager
    [courseId]="courseId"
    [sectionId]="sectionId"
    [lessonId]="lessonId" />
}
    </div>
  }

  <!-- ✅ Hint in add mode -->
  @if (mode === 'add') {
    <p class="mt-2 text-xs text-gray-400 dark:text-gray-500 italic">
      💡 Save the lesson first to manage its resources.
    </p>
  }

  <div class="flex items-center justify-between mt-3">
    <label class="flex items-center gap-2 text-xs text-gray-600 dark:text-gray-400 cursor-pointer">
      <input type="checkbox" [(ngModel)]="form.isFreePreview" class="rounded border-gray-300 text-blue-600"/>
      Free Preview
    </label>
    <div class="flex items-center gap-2">
      <button (click)="cancel.emit()"
        class="text-xs px-3 py-1.5 rounded-lg bg-gray-100 dark:bg-gray-600 hover:bg-gray-200 dark:hover:bg-gray-500 text-gray-600 dark:text-gray-300 transition-colors cursor-pointer">
        Cancel
      </button>
      <button (click)="submit()" [disabled]="isSaving"
        [class]="mode === 'add'
          ? 'text-xs px-3 py-1.5 rounded-lg bg-green-600 hover:bg-green-700 text-white transition-colors cursor-pointer disabled:opacity-50 flex items-center gap-1.5'
          : 'text-xs px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white transition-colors cursor-pointer disabled:opacity-50 flex items-center gap-1.5'">
        @if (isSaving) {
          <svg class="w-3 h-3 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
          </svg>
        }
        {{ mode === 'add' ? 'Add Lesson' : 'Save Lesson' }}
      </button>
    </div>
  </div>
</div>
