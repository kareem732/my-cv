<div class="bg-white dark:bg-gray-800 border-2 border-dashed border-blue-400 rounded-xl p-4">
  <p class="text-xs font-semibold text-blue-600 dark:text-blue-400 mb-3">New Section</p>
  <div class="flex items-center gap-3">
    <input #input
      [(ngModel)]="title"
      (keydown.enter)="submit()"
      (keydown.escape)="cancel.emit()"
      class="flex-1 text-sm bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg px-3 py-2 outline-none focus:border-blue-400 text-gray-900 dark:text-white"
      placeholder="Section title..."/>
    <button (click)="submit()" [disabled]="isSaving || !title.trim()"
      class="text-sm px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white transition-colors cursor-pointer disabled:opacity-50 flex items-center gap-2">
      @if (isSaving) {
        <svg class="w-3.5 h-3.5 animate-spin" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
        </svg>
      }
      Add
    </button>
    <button (click)="cancel.emit()"
      class="text-sm px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-600 hover:bg-gray-200 text-gray-600 dark:text-gray-300 transition-colors cursor-pointer">
      Cancel
    </button>
  </div>
</div>
