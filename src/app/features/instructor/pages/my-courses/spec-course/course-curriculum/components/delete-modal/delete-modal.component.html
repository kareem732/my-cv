@if (isOpen) {
  <div class="fixed inset-0 z-40 flex items-center justify-center bg-black/50 px-4"
    (click)="close.emit()">
    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-xl w-full max-w-sm p-6"
      (click)="$event.stopPropagation()">
      <div class="flex items-center gap-3 mb-4">
        <div class="w-10 h-10 rounded-full bg-red-100 dark:bg-red-900/30 flex items-center justify-center flex-shrink-0">
          <svg class="w-5 h-5 text-red-600 dark:text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
          </svg>
        </div>
        <div>
          <h3 class="text-base font-semibold text-gray-900 dark:text-white">
            Delete {{ targetType === 'section' ? 'Section' : 'Lesson' }}
          </h3>
          <p class="text-sm text-gray-500 dark:text-gray-400">
            @if (targetType === 'section') {
              This will delete the section and all lessons inside it.
            } @else {
              This action cannot be undone.
            }
          </p>
        </div>
      </div>
      <div class="flex gap-3 mt-5">
        <button (click)="close.emit()"
          class="flex-1 px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 bg-gray-100 dark:bg-gray-700 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors cursor-pointer">
          Cancel
        </button>
        <button (click)="confirm.emit()" [disabled]="isLoading"
          class="flex-1 px-4 py-2 text-sm font-medium text-white bg-red-600 hover:bg-red-700 dark:bg-red-700 dark:hover:bg-red-800 rounded-lg transition-colors flex items-center justify-center gap-2 cursor-pointer disabled:opacity-60">
          @if (isLoading) {
            <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/>
            </svg>
          }
          Delete
        </button>
      </div>
    </div>
  </div>
}
