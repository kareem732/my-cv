<aside id="top-bar-sidebar" class="fixed top-0 left-0 z-40 w-64 h-full transition-transform mt-4 -translate-x-full sm:translate-x-0" aria-label="Sidebar">
  <div class="h-full px-3 py-4 overflow-y-auto bg-neutral-primary-soft border-e border-default">
    <ul class="space-y-2 font-medium mt-10">

      <li>
        <a routerLink="/instructor/dashboard"
           routerLinkActive="bg-neutral-tertiary text-fg-brand"
           [routerLinkActiveOptions]="{exact: true}"
           class="flex items-center px-2 py-1.5 text-body rounded-base hover:bg-neutral-tertiary hover:text-fg-brand group">
          <svg class="w-5 h-5 transition duration-75 group-hover:text-fg-brand" fill="none" viewBox="0 0 24 24">
            <rect x="3" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/>
            <rect x="14" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/>
            <rect x="3" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/>
            <rect x="14" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/>
          </svg>
          <span class="ms-3">Dashboard</span>
        </a>
      </li>

      <li>
        <a routerLink="/instructor/my-courses"
           routerLinkActive="bg-neutral-tertiary text-fg-brand"
           class="flex items-center px-2 py-1.5 text-body rounded-base hover:bg-neutral-tertiary hover:text-fg-brand group">
          <svg class="w-5 h-5 transition duration-75 group-hover:text-fg-brand" fill="none" viewBox="0 0 24 24">
            <circle cx="9" cy="7" r="4" stroke="currentColor" stroke-width="2"/>
            <path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M3 21v-1a6 6 0 0 1 6-6h0a6 6 0 0 1 6 6v1"/>
            <path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 3.13a4 4 0 0 1 0 7.75M21 21v-1a4 4 0 0 0-3-3.85"/>
          </svg>
          <span class="ms-3">My Courses</span>
        </a>
      </li>

      <li>
        <a routerLink="/instructor/payout"
           routerLinkActive="bg-neutral-tertiary text-fg-brand"
           class="flex items-center px-2 py-1.5 text-body rounded-base hover:bg-neutral-tertiary hover:text-fg-brand group">
          <svg class="w-5 h-5 transition duration-75 group-hover:text-fg-brand" fill="none" viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3 7a2 2 0 0 1 2-2h4.586a1 1 0 0 1 .707.293l8.414 8.414a2 2 0 0 1 0 2.828l-3.172 3.172a2 2 0 0 1-2.828 0L4.293 13.293A1 1 0 0 1 4 12.586V7z"/>
            <circle cx="7.5" cy="9.5" r="1" fill="currentColor"/>
          </svg>
          <span class="ms-3">Payout</span>
        </a>
      </li>

      <li>
        <a routerLink="/instructor/reviews"
           routerLinkActive="bg-neutral-tertiary text-fg-brand"
           class="flex items-center px-2 py-1.5 text-body rounded-base hover:bg-neutral-tertiary hover:text-fg-brand group">
          <svg class="w-5 h-5 transition duration-75 group-hover:text-fg-brand" fill="none" viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3 7a2 2 0 0 1 2-2h4.586a1 1 0 0 1 .707.293l8.414 8.414a2 2 0 0 1 0 2.828l-3.172 3.172a2 2 0 0 1-2.828 0L4.293 13.293A1 1 0 0 1 4 12.586V7z"/>
            <circle cx="7.5" cy="9.5" r="1" fill="currentColor"/>
          </svg>
          <span class="ms-3">Reviews</span>
        </a>
      </li>

      <li>
        <button (click)="logoutClicked.emit()"
                class="w-full text-start cursor-pointer flex items-center px-2 py-1.5 text-body rounded-base hover:bg-neutral-tertiary hover:text-red-600 group">
          <svg class="w-5 h-5 transition duration-75 group-hover:text-red-600" fill="none" viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h4a3 3 0 0 1 3 3v1"/>
          </svg>
          <span class="ms-3">Logout</span>
        </button>
      </li>

    </ul>
  </div>
</aside>
