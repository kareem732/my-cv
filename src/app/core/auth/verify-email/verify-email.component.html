<div class="flex flex-col lg:flex-row min-h-screen bg-white font-sans">

  <div class="w-full lg:w-1/2 flex flex-col p-6 md:p-12 lg:p-20 relative">

    <div class="logo mb-8">
      <a routerLink="/" class="inline-block">
        <img
          src="images/500205945d3631c63ffe0ceb730308f60740894b.png"
          class="h-[100px] md:h-[130px] w-auto object-contain transition-transform duration-300 hover:scale-105"
          alt="Logo"
        />
      </a>
    </div>

    <div class="flex-grow flex flex-col justify-start items-center lg:items-start pt-10">
      <div class="max-w-md w-full">

        <div class="mb-10 text-start">
          <h2 class="text-4xl font-bold text-gray-900 mb-6">Verify Email</h2>
          <p class="text-gray-500 text-lg">
            Don’t worry, happens to all of us. Enter the code sent to your email to recover your account.
          </p>
        </div>

        @if (errMsg()) {
          <div class="p-4 mb-6 text-sm text-red-800 rounded-2xl bg-red-50 border border-red-100 animate-fade-in">
            {{ errMsg() }}
          </div>
        }

        <form [formGroup]="verifyForm" (ngSubmit)="handleVerify()" class="space-y-10">

          <div class="relative">
  <input
    type="email"
    formControlName="email"
    id="email"
    placeholder=" "
    readonly
    class="block px-2.5 pb-2.5 pt-4 w-full text-sm text-gray-900 bg-gray-50 rounded-xl border-2 border-gray-300 appearance-none focus:outline-none focus:ring-0 focus:border-[#4A3ADF] peer cursor-not-allowed"
  />
  <label
    for="email"
    class="absolute text-sm text-gray-500 duration-300 transform -translate-y-4 scale-75 top-2 z-10 origin-[0] bg-white px-2 peer-focus:px-2 peer-focus:text-[#4A3ADF] peer-placeholder-shown:scale-100 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:top-1/2 peer-focus:top-2 peer-focus:scale-75 peer-focus:-translate-y-4 start-3"
  >
    Email Address
  </label>
</div>

          <div class="relative">
            <input
              type="text"
              formControlName="code"
              id="code"
              maxlength="6"
              class="block px-2.5 pb-2.5 pt-4 w-full text-sm text-gray-900 bg-transparent rounded-xl border-2 border-gray-300 appearance-none focus:outline-none focus:ring-0 focus:border-[#4A3ADF] peer font-bold tracking-[0.5em]"
              placeholder=" "
            />
            <label
              for="code"
              class="absolute text-sm text-gray-500 duration-300 transform -translate-y-4 scale-75 top-2 z-10 origin-[0] bg-white px-2 peer-focus:px-2 peer-focus:text-[#4A3ADF] peer-placeholder-shown:scale-100 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:top-1/2 peer-focus:top-2 peer-focus:scale-75 peer-focus:-translate-y-4 start-3"
            >
              Verification Code
            </label>
            @if (verifyForm.get('code')?.touched && verifyForm.get('code')?.invalid) {
              <span class="text-[11px] text-red-500 absolute mt-1">Code must be 6 digits</span>
            }
          </div>

          <button
            type="submit"
            [disabled]="verifyForm.invalid || loader()"
            class="w-full text-white bg-[#0C21C1] hover:bg-[#392cb3] disabled:bg-gray-400 font-medium rounded-full text-lg px-5 py-4 text-center transition-all duration-300 active:scale-95 shadow-lg shadow-indigo-200">

            @if (loader()) {
              <div class="flex items-center justify-center">
                <div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin me-3"></div>
                <span>Verifying...</span>
              </div>
            } @else {
              Submit
            }
          </button>
        </form>
      </div>
    </div>
  </div>

  <div class="hidden lg:block lg:w-1/2 relative p-6">
    <div class="w-full h-full relative overflow-hidden rounded-[40px]">
      <img src="images/bb36d616a30a7891c17abc43dd9b9bb3946b2227.jpg" alt="Login Background" class="absolute inset-0 w-full h-full object-cover">
    </div>
  </div>

</div>
