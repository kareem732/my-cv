<div class="flex flex-col lg:flex-row min-h-screen bg-white dark:bg-gray-900 font-sans">
  <div class="w-full lg:w-1/2 flex flex-col p-6 md:p-12 lg:p-20 relative">
    <div class="flex items-center flex-shrink-0">
      <a routerLink="/about-us" class="flex items-center h-[80px] cursor-pointer gap-2">
        <!-- SVG unchanged -->
        <div class="flex flex-col leading-none">
          <span style="font-family:system-ui,sans-serif; font-size:22px; font-weight:800; color:#4A3ADF; letter-spacing:-0.5px;">
            Kno<span style="color:#F97316;">via</span>
          </span>
        </div>
      </a>
    </div>

    <div class="flex-grow flex flex-col justify-center items-center lg:items-start">
      <div class="max-w-md w-full">
        <div class="mb-10 text-start">
          <h2 class="text-4xl font-bold text-gray-900 dark:text-white mb-6">Sign in</h2>
          <p class="text-gray-500 dark:text-gray-400 text-lg">
            If you don't have an account register <br class="hidden sm:block" />
            You can
            <span class="text-[#4A3ADF] font-bold cursor-pointer hover:underline" routerLink="/auth/register">
              Register Here!
            </span>
          </p>
        </div>

        @if (errMsg()) {
          <div class="p-4 mb-6 text-sm text-red-800 dark:text-red-400 rounded-2xl bg-red-50 dark:bg-red-900/20 border border-red-100 dark:border-red-800 animate-fade-in">
            {{ errMsg() }}
          </div>
        }

        <form [formGroup]="loginForm" (ngSubmit)="login()" class="space-y-10">
         <div class="relative z-0 w-full group">
  <input
    type="email"
    formControlName="email"
    id="email"
    class="block py-3 px-0 w-full text-sm text-gray-900 dark:text-white bg-transparent border-0 border-b-2 border-gray-300 dark:border-gray-600 appearance-none focus:outline-none focus:ring-0 focus:border-[#4A3ADF] peer"
    placeholder=" "
  />
  <label
    for="email"
    class="peer-focus:font-medium absolute text-gray-500 dark:text-gray-400 duration-300 transform -translate-y-8 scale-75 top-3 -z-10 origin-[0] peer-focus:start-0 peer-focus:text-[#4A3ADF] peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-8">
    Email Address
  </label>
  @if (loginForm.get("email")?.touched && loginForm.get("email")?.invalid) {
    <span class="text-[11px] text-red-500 absolute mt-1">Please enter a valid email address</span>
  }
</div>

<div class="relative z-0 w-full group">
  <input
    [type]="showPassword() ? 'text' : 'password'"
    formControlName="password"
    id="password"
    class="block py-3 px-0 w-full text-sm text-gray-900 dark:text-white bg-transparent border-0 border-b-2 border-gray-300 dark:border-gray-600 appearance-none focus:outline-none focus:ring-0 focus:border-[#4A3ADF] peer
           [&::-ms-reveal]:hidden [&::-ms-clear]:hidden"
    placeholder=" "
  />
  <label
    for="password"
    class="peer-focus:font-medium absolute text-gray-500 dark:text-gray-400 duration-300 transform -translate-y-8 scale-75 top-3 -z-10 origin-[0] peer-focus:start-0 peer-focus:text-[#4A3ADF] peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-8">
    Password
  </label>
  <button type="button" (click)="showPassword.set(!showPassword())"
    class="absolute right-0 top-3 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 cursor-pointer transition-colors">
    @if (showPassword()) {
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
      </svg>
    } @else {
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
      </svg>
    }
  </button>
</div>

          <div class="flex items-center justify-between w-full">
            <div class="flex items-center">
              <input
                id="remember"
                type="checkbox"
                formControlName="rememberMe"
                class="w-4 h-4 bg-gray-100 dark:bg-gray-700 border-none rounded-sm focus:ring-0 cursor-pointer accent-[#0C21C1]"
              />
              <label for="remember" class="ms-2 text-sm font-medium text-[#B5B5B5] dark:text-gray-400 cursor-pointer select-none">
                Remember me
              </label>
            </div>
            <a class="text-sm text-[#B5B5B5] dark:text-gray-400 hover:text-[#0C21C1] dark:hover:text-[#4A3ADF] hover:underline cursor-pointer font-semibold transition-colors"
              routerLink="/auth/forget-password">
              Forgot Password?
            </a>
          </div>

          <button
            type="submit"
            [disabled]="loginForm.invalid || loader()"
            class="w-full text-white cursor-pointer bg-[#0C21C1] hover:bg-[#392cb3] disabled:bg-gray-400 dark:disabled:bg-gray-600 disabled:cursor-not-allowed focus:ring-4 focus:ring-blue-300 dark:focus:ring-blue-800 font-medium rounded-full text-lg px-5 py-4 text-center transition-all duration-300 active:scale-95 shadow-lg shadow-indigo-200 dark:shadow-indigo-900/30"
          >
            @if (loader()) {
              <div class="flex items-center justify-center">
                <div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin me-3"></div>
                <span>Signing in...</span>
              </div>
            } @else {
              Login
            }
          </button>
        </form>

        <p class="text-center text-[#B5B5B5] dark:text-gray-500 text-[16px] my-10">or continue with</p>
        <div #googleBtn class="w-full flex justify-center"></div>
      </div>
    </div>
  </div>

  <div class="hidden lg:block lg:w-1/2 relative p-6">
    <div class="w-full h-full relative overflow-hidden rounded-[40px] shadow-2xl">
      <img src="images/added loginandregister.jpeg" alt="Login Background" class="absolute inset-0 w-full h-full object-cover"/>
      <div class="absolute inset-0 bg-gradient-to-t from-black/10 to-transparent"></div>
    </div>
  </div>
</div>
